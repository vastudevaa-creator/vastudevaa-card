<style>
:root{
  --navy:#0a1f3c; --navy2:#0f2c54; --azure:#2f6fed; --azure-soft:#5e93ff;
  --bg:#eef1f7; --surface:#ffffff; --surface2:#f4f7fb;
  --text:#0b1220; --text-soft:#5b6577; --text-faint:#8b94a6; --border:#e6eaf2;
  --accent:#2f6fed; --shadow:0 12px 44px -14px rgba(10,31,60,.40),0 2px 10px -4px rgba(10,31,60,.18);
  --shadow-soft:0 1px 2px rgba(10,31,60,.04),0 6px 16px -10px rgba(10,31,60,.25);
}
[data-theme="dark"]{
  --bg:#060b14; --surface:#0e1828; --surface2:#13203450;
  --text:#eef2f9; --text-soft:#a8b3c7; --text-faint:#6b7689; --border:#1c2840;
  --accent:#5e93ff;
  --shadow:0 18px 50px -14px rgba(0,0,0,.75); --shadow-soft:0 1px 2px rgba(0,0,0,.4),0 6px 16px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:'Manrope',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(120% 55% at 50% -5%, color-mix(in srgb,var(--azure) 13%, transparent), transparent 60%),var(--bg);
  min-height:100vh;min-height:100dvh;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .4s;
  display:flex;align-items:center;justify-content:center;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom));
}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;font-weight:600;line-height:1.1;letter-spacing:-.01em;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}

/* ============ CARD (fits one screen) ============ */
.shell{width:100%;max-width:412px;}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;animation:rise .65s cubic-bezier(.2,.7,.2,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.99);}to{opacity:1;transform:none;}}

.theme-fab{position:absolute;top:12px;left:12px;z-index:5;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);backdrop-filter:blur(6px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.theme-fab svg{width:16px;height:16px;}

.banner{height:100px;position:relative;background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 45%,var(--azure) 140%);}
.banner::after{content:"";position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:16px 16px;mask-image:radial-gradient(ellipse at 70% 30%,#000,transparent 75%);}
.brand-chip{position:absolute;top:14px;right:14px;z-index:2;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(6px);border-radius:13px;padding:8px 13px;}
.brand-chip img{height:40px;width:auto;}
.brand-chip span{color:#fff;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:16px;letter-spacing:.04em;}

.card-in{padding:0 18px 18px;}
.idrow{display:flex;align-items:flex-end;gap:15px;text-align:left;}
.photo{width:104px;height:120px;flex-shrink:0;margin-top:-24px;position:relative;z-index:3;border-radius:18px;border:4px solid var(--surface);object-fit:cover;object-position:center top;background:linear-gradient(150deg,var(--navy),var(--azure));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:600;box-shadow:0 10px 26px -10px rgba(10,31,60,.5);}
.idtext{padding-bottom:6px;}
.name{font-size:27px;line-height:1.06;}
.role{color:var(--accent);font-weight:600;font-size:13px;font-family:'Manrope',sans-serif;margin-top:2px;}
.taxonomy{text-align:center;font-family:'Manrope',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.01em;color:var(--text-soft);margin-top:9px;line-height:1.3;white-space:nowrap;overflow:hidden;}
.taxonomy .sep{color:var(--accent);margin:0 4px;font-weight:400;}

/* ============ THE 12-BUTTON GRID ============ */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px;}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:13px 4px;border-radius:16px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;transition:transform .16s,border-color .2s,box-shadow .2s;font-family:'Manrope',sans-serif;}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow-soft);}
.tile:active{transform:scale(.95);}
.tile .ti{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;}
.tile .ti svg{width:21px;height:21px;}
.tile span:last-child{font-size:11px;font-weight:600;color:var(--text);letter-spacing:.01em;}
.t-call{background:var(--azure);} .t-wa{background:#25d366;} .t-mail{background:#ea4d5b;}
.t-web{background:var(--navy);} .t-save{background:#6b53e0;} .t-share{background:#0f9d8c;}
.t-info{background:linear-gradient(145deg,var(--navy),var(--navy2));}
.t-info2{background:linear-gradient(145deg,var(--azure),var(--navy));}
.t-book{background:#e0852f;}

.foot{display:flex;align-items:center;justify-content:space-between;margin-top:15px;}
.socials{display:flex;gap:8px;}
.socials a{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-soft);transition:.18s;}
.socials a:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.socials svg{width:16px;height:16px;}
.tagline{font-size:10px;color:var(--text-faint);letter-spacing:.03em;text-align:right;max-width:160px;}

/* ============ SLIDE-UP SHEET ============ */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(8,14,26,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);width:100%;max-width:460px;max-height:92vh;max-height:92dvh;z-index:81;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -10px 50px -10px rgba(0,0,0,.45);display:flex;flex-direction:column;transition:transform .38s cubic-bezier(.2,.8,.2,1);}
.sheet.show{transform:translateX(-50%) translateY(0);}
.sheet-head{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);border-radius:26px 26px 0 0;z-index:2;}
.sheet-head .grab{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:var(--border);}
.sheet-head h2{flex:1;font-size:23px;margin-top:4px;}
.sheet-close{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);}
.sheet-close svg{width:18px;height:18px;}
.sheet-body{padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;}

.section-tab{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;margin:26px 0 12px;padding-top:18px;border-top:1px solid var(--border);}
.section-tab:first-child{margin-top:0;padding-top:0;border-top:none;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:7px;}
.lead{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--text);margin-bottom:13px;line-height:1.45;}
.sheet-body p{color:var(--text-soft);font-size:14.5px;margin-bottom:12px;}
.stat-strip{display:flex;gap:10px;margin:6px 0 16px;}
.stat{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:12px;text-align:center;}
.stat .n{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--accent);line-height:1;}
.stat .l{font-size:10.5px;color:var(--text-soft);margin-top:4px;}
.checks{list-style:none;display:flex;flex-direction:column;gap:9px;margin:6px 0 4px;}
.checks li{display:flex;gap:10px;font-size:14px;color:var(--text-soft);}
.checks li svg{width:18px;height:18px;color:var(--accent);flex-shrink:0;margin-top:2px;}
.block{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:17px;margin-bottom:12px;}
.block h3{font-size:20px;margin-bottom:6px;display:flex;align-items:center;gap:9px;}
.block .num{font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:700;color:#fff;background:var(--navy);width:27px;height:27px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.subh{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:10px 0 3px;}
.block p:last-child{margin-bottom:0;}
.iconrow{display:flex;align-items:flex-start;gap:13px;padding:13px 0;border-bottom:1px solid var(--border);}
.iconrow:last-child{border:none;}
.iconrow .ib{flex:0 0 42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);display:flex;align-items:center;justify-content:center;}
.iconrow .ib svg{width:20px;height:20px;}
.iconrow b{font-size:15px;} .iconrow p{font-size:13px;margin:2px 0 0;}
.course-top{padding:15px 17px;background:linear-gradient(125deg,var(--navy),var(--navy2));color:#fff;border-radius:15px 15px 0 0;}
.course-top small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;}
.course-top h3{color:#fff;font-size:21px;margin-top:2px;}
.tcard{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:17px;margin-bottom:11px;}
.tcard .st{color:#f5a623;letter-spacing:2px;font-size:13px;}
.tcard p{font-style:italic;font-size:14px;margin:6px 0 11px;}
.tperson{display:flex;align-items:center;gap:11px;}
.tperson .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(150deg,var(--navy),var(--azure));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:600;}
.tperson b{font-size:13.5px;display:block;} .tperson small{font-size:11.5px;color:var(--text-faint);}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.gtile{aspect-ratio:4/3;border-radius:13px;border:1px dashed var(--border);background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--text-faint);text-align:center;padding:8px;font-size:11.5px;font-weight:600;}
.gtile.video{background:linear-gradient(135deg,var(--navy),var(--navy2));border:none;color:rgba(255,255,255,.9);}
.gtile svg{width:24px;height:24px;}
.blogc{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:11px;}
.blogc .bi{height:84px;background:linear-gradient(135deg,var(--azure),var(--navy));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Cormorant Garamond',serif;font-size:17px;}
.blogc .bm{padding:13px 15px;}
.blogc .cat{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);}
.blogc h3{font-size:18px;margin:4px 0 4px;}
.blogc p{font-size:12.5px;margin:0;}
.faq{border:1px solid var(--border);border-radius:13px;margin-bottom:8px;overflow:hidden;}
.faq>button{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:14px 15px;font-family:'Manrope',sans-serif;font-size:14px;font-weight:600;color:var(--text);display:flex;justify-content:space-between;gap:12px;align-items:center;}
.faq .pm{flex-shrink:0;width:22px;height:22px;border-radius:6px;background:var(--surface2);color:var(--accent);display:flex;align-items:center;justify-content:center;transition:.25s;}
.faq.open .pm{transform:rotate(45deg);background:var(--accent);color:#fff;}
.faq .ans{max-height:0;overflow:hidden;transition:max-height .3s;}
.faq .ans p{padding:0 15px 14px;font-size:13px;margin:0;}
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px;}
.tabs button{font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;padding:8px 13px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text-soft);cursor:pointer;}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-soft);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;font-family:'Manrope',sans-serif;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:11px 13px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);}
.field textarea{resize:vertical;min-height:78px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.map{height:190px;border-radius:14px;overflow:hidden;border:1px solid var(--border);margin-top:13px;}
.map iframe{width:100%;height:100%;border:0;}
.qrbig{display:flex;flex-direction:column;align-items:center;gap:13px;padding:6px 0 2px;}
.qrbig .box{background:#fff;padding:15px;border-radius:18px;border:1px solid var(--border);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:'Manrope',sans-serif;font-weight:600;font-size:14px;padding:13px 20px;border-radius:13px;border:none;cursor:pointer;width:100%;transition:.18s;}
.btn:active{transform:scale(.98);}
.btn svg{width:17px;height:17px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-wa{background:#25d366;color:#fff;}
.btn-row{display:flex;gap:9px;margin-top:6px;}
.note{font-size:11.5px;color:var(--text-faint);text-align:center;margin-top:10px;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;z-index:120;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:360px){
  .name{font-size:23px;} .photo{width:92px;height:108px;}
  .tile{padding:11px 4px;} .tile .ti{width:38px;height:38px;}
}
</style>

const vcard=['BEGIN:VCARD','VERSION:3.0','N:Guptaa;Rohit;Dr.;;','FN:Dr. Rohit Guptaa','ORG:VASTUDEVAA','TITLE:Founder - VASTUDEVAA','TEL;TYPE=CELL:+917719562738','EMAIL;TYPE=WORK:rohitguptaa@vastudevaa.com','URL:https://www.vastudevaa.com','ADR;TYPE=WORK:;;Plot 47 Level 1 Industrial Area Phase 1;Chandigarh;;160001;India','NOTE:Vastu | Astrology | Numerology | Institute','END:VCARD'].join('\n');
function saveContact(){ const b=new Blob([vcard],{type:'text/vcard'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='Dr-Rohit-Guptaa.vcf'; document.body.appendChild(a); a.click(); a.remove(); toast('Contact saved ✓'); }
document.getElementById('saveBtn').onclick=saveContact;
function buildBigQR(){ const el=document.getElementById('qrTarget'); if(el){ el.innerHTML=''; new QRCode(el,{text:vcard,width:188,height:188,colorDark:'#0a1f3c',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); } const sb=document.getElementById('saveBtn2'); if(sb) sb.onclick=saveContact; }
document.getElementById('shareBtn').onclick=async()=>{ const d={title:'Dr. Rohit Guptaa — VASTUDEVAA',text:'Vastu, Astrology & Numerology Consultant',url:'https://www.vastudevaa.com'}; try{ if(navigator.share){await navigator.share(d);} else {await navigator.clipboard.writeText(d.url); toast('Link copied ✓');} }catch(e){} };

/* ---------- FORM ---------- */
function bindTabs(){ document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); document.getElementById('formType').value=b.dataset.f; }); }
function submitLead(e){ e.preventDefault(); const f=e.target,g=n=>f.elements[n].value; const m=`*New ${g('form_type')}*%0A%0A*Name:* ${encodeURIComponent(g('name'))}%0A*Phone:* ${encodeURIComponent(g('phone'))}%0A*Email:* ${encodeURIComponent(g('email')||'-')}%0A*City:* ${encodeURIComponent(g('city')||'-')}%0A*Service:* ${encodeURIComponent(g('service'))}%0A*Message:* ${encodeURIComponent(g('message')||'-')}`; window.open('https://wa.me/917719562738?text='+m,'_blank'); toast('Opening WhatsApp...'); return false; }

/* ---------- TOAST ---------- */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
